server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API аналитики — через этот же адрес, чтобы фронт и API были одним источником:
    # фронт собирается с VITE_API_BASE_URL=/api/v1, CORS не нужен.
    # host.docker.internal — сервер (extra_hosts в docker-compose.yml), аналитика на порту 8020.
    location /api/ {
        proxy_pass http://host.docker.internal:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}